# Подставка для статуэток: метка NTAG215 в основании → событие в Home Assistant,
# кольцо WS2812B на 24 пикселя играет анимацию (ring_engine.h): заполняется с двух
# сторон, пока метку подносят, «вдыхает», горит и гаснет. Цвет, время свечения и
# сценарий каждой статуэтки задаются в HA блупринтом blueprints/figurine.yaml.
#
# Питание: зарядник USB-C от 2 А через гнездо в корпусе. Ограничитель в ring_engine.h
# держит оценку тока кольца в бюджете под зарядник charger_ma: на 2 А белый горит на ~94 %,
# цвета — на 100 %. Прошивать через USB компьютера можно, но метки на подставку в это
# время не класть: ограничитель рассчитан на зарядник, а не на порт компьютера.
#
# Сброс к заводским (Wi-Fi забыт, снова «Figurki Setup»): 5 раз подряд включить
# питание, каждый раз не дольше 10 с, или кнопка «Сброс к заводским» в HA.
# Сменил Wi-Fi — сбрасывать не обязательно: не найдя старую сеть, подставка через
# минуту сама поднимает «Figurki Setup».
#
# Обновляется сама через интернет: раз в час читает манифест на GitHub Pages и ставит
# версию новее своей, когда подставка 10 минут пустая (см. README, «Обновление прошивки»).
# Новая прошивка не продержалась минуту — загрузчик возвращает прежнюю.

substitutions:
  # На какой зарядник рассчитан бюджет тока кольца, мА.
  charger_ma: "2000"

esphome:
  # Не менять: по имени HA узнаёт подставку, а блупринт вызывает esphome.figurki_show_color —
  # после обновления у владельца перестали бы работать автоматизации.
  name: figurki
  friendly_name: Статуэтки
  project:
    name: rudnik275.nfc-figurines
    # Тег релиза — v<version>: по нему CI собирает прошивку для всех подставок.
    version: "0.8"
  includes:
    - ring_engine.h
    - firmware_version.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Перезагрузились от просадки питания (слабый зарядник, порт компьютера) —
          // до следующего включения кольцо светит вполсилы, а не уходит в петлю перезагрузок.
          if (esp_reset_reason() == ESP_RST_BROWNOUT) {
            id(ring_budget) = 300;
            ESP_LOGW("power", "Перезагрузка от просадки питания — бюджет кольца %.0f мА", id(ring_budget));
          } else {
            id(ring_budget) = ring_budget_ma(${charger_ma});
          }
      - light.turn_on:
          id: ring
          brightness: 100%
          effect: "Кольцо"
      # Пиксели помнят последний цвет, пока есть питание. Сначала кольцо гаснет первым
      # кадром анимации, потом включается Wi-Fi: его пик тока не совпадает с горящей лентой.
      - delay: 1s
      - wifi.enable:

esp32:
  board: esp32dev

logger:

# Без шифрования: HA добавляет подставку одной кнопкой, ключ вводить не нужно
# (решение 22.10.2026 — устройство в домашней сети друга, ключ только мешал настройке).
api:
  # Без этого устройство перезагружается каждые 15 минут, пока его не добавили в HA.
  reboot_timeout: 0s
  actions:
    # Вызывает блупринт: esphome.figurki_show_color. Имя и параметры, как и событие
    # esphome.figurine_removed с tag_id, — договор с блупринтом: новые параметры добавлять
    # можно, старые переименовывать и удалять — нет.
    - action: show_color
      variables:
        red: int
        green: int
        blue: int
        hold: float
      then:
        - lambda: 'ring_engine().set_color(red, green, blue, hold);'

ota:
  # По локальной сети: esphome run с компьютера рядом.
  - platform: esphome
  # Через интернет: прошивку скачивает сама подставка (update ниже).
  - platform: http_request

# HTTPS с проверкой сертификата. Заголовки GitHub Pages влезают в буфер по умолчанию,
# GitHub Releases — нет («Out of buffer»), поэтому прошивку раздают Pages.
http_request:

update:
  - platform: http_request
    id: firmware
    name: "Прошивка"
    source: https://rudnik275.github.io/nfc-figurines/firmware/figurki.manifest.json
    update_interval: 1h

interval:
  # Новая версия ставится сама, когда подставка 10 минут пустая: перезагрузка не
  # оборвёт сценарий статуэтки и не запустит его заново. Ту же или старую версию
  # (стенд с dev-сборкой) можно поставить только кнопкой в HA.
  - interval: 1min
    then:
      - if:
          condition:
            lambda: |-
              auto *u = id(firmware);
              return u->state == update::UPDATE_STATE_AVAILABLE &&
                     version_newer(u->update_info.latest_version, u->update_info.current_version) &&
                     id(present_tag).empty() && !id(raw_present) &&
                     millis() - id(last_activity) > 10 * 60 * 1000;
          then:
            - logger.log:
                format: "Ставлю прошивку %s вместо %s"
                args: ['id(firmware)->update_info.latest_version.c_str()', 'id(firmware)->update_info.current_version.c_str()']
            - update.perform: firmware

factory_reset:
  resets_required: 5
  max_delay: 10s
  on_increment:
    - logger.log:
        format: "Сброс: включение %u из %u"
        args: ['x', 'target']

# Wi-Fi вводится с телефона: точка доступа «Figurki Setup» → страница выбора сети.
# Сетей (ssid, networks) здесь не задавать: введённый Wi-Fi хранится под постоянным ключом,
# только пока их нет; с ними ключ зависит от конфига, и после обновления подставка забудет сеть.
wifi:
  # Включается из on_boot, когда кольцо уже погашено.
  enable_on_boot: false
  ap:
    ssid: "Figurki Setup"

captive_portal:

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

globals:
  # Сколько мА можно отдать кольцу; задаётся при загрузке.
  - id: ring_budget
    type: float
    initial_value: '300'
  # Что видит ридер прямо сейчас, без сглаживания: для анимации кольца.
  - id: raw_present
    type: bool
    initial_value: 'false'
  # Ридер изредка пропускает один опрос и при этом объявляет метку снятой.
  # Для Home Assistant статуэтка снята, только если её не видно 1.5 с подряд.
  - id: present_tag
    type: std::string
    initial_value: '""'
  # Когда ридер последний раз видел метку или потерял её, millis(): для обновления.
  - id: last_activity
    type: uint32_t
    initial_value: '0'

button:
  - platform: factory_reset
    name: "Сброс к заводским"
    entity_category: config

script:
  - id: confirm_removed
    mode: restart
    then:
      - delay: 1500ms
      - logger.log:
          format: "СНЯЛИ: %s"
          args: ['id(present_tag).c_str()']
      - homeassistant.event:
          event: esphome.figurine_removed
          data:
            tag_id: !lambda 'return id(present_tag);'
      - lambda: 'id(present_tag) = "";'

pn532_spi:
  cs_pin: GPIO5
  # Чаще опрос — точнее «сигнал» для анимации.
  update_interval: 200ms
  on_tag:
    then:
      - lambda: |-
          id(raw_present) = true;
          id(last_activity) = millis();
      - if:
          condition:
            lambda: 'return x == id(present_tag);'
          then:
            # Та же метка вернулась после пропуска — она никуда не уходила.
            - script.stop: confirm_removed
          else:
            # Статуэтку сменили быстрее 1.5 с — сначала снимаем прежнюю.
            - if:
                condition:
                  script.is_running: confirm_removed
                then:
                  - script.stop: confirm_removed
                  - homeassistant.event:
                      event: esphome.figurine_removed
                      data:
                        tag_id: !lambda 'return id(present_tag);'
            - lambda: |-
                id(present_tag) = x;
                ring_engine().new_tag();
            - logger.log:
                format: "ПОСТАВИЛИ: %s"
                args: ['x.c_str()']
            # Метки прошивке не нужны: в HA уходит UID, там метку называют и выбирают в блупринте.
            - homeassistant.tag_scanned: !lambda 'return x;'
  on_tag_removed:
    then:
      - lambda: |-
          id(raw_present) = false;
          id(last_activity) = millis();
      - script.execute: confirm_removed

light:
  - platform: esp32_rmt_led_strip
    id: ring
    # Кольцом управляет только анимация на устройстве, в HA его не видно.
    internal: true
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    pin: GPIO16
    num_leds: 24
    chipset: WS2812
    channel_colors: GRB
    effects:
      - addressable_lambda:
          name: "Кольцо"
          update_interval: 16ms
          lambda: |-
            auto status = RingEngine::Status::kOk;
            if (!wifi::global_wifi_component->is_connected()) {
              status = RingEngine::Status::kWifiSetup;
            } else if (!api::global_api_server->is_connected() && millis() < 15 * 60 * 1000) {
              // Первые 15 минут после включения подсказываем, что HA ещё не подключён.
              status = RingEngine::Status::kNoHa;
            }
            auto &e = ring_engine();
            e.tick(millis(), id(raw_present), status);
            const int n = std::min<int>(it.size(), RingEngine::kPixels);
            RingRgb px[RingEngine::kPixels];
            for (int i = 0; i < n; i++) px[i] = e.pixel(i);
            // Ток кольца — не больше, чем позволяет зарядник.
            limit_power(px, n, id(ring_budget));
            for (int i = 0; i < n; i++)
              it[i] = Color(uint8_t(px[i].r * 255), uint8_t(px[i].g * 255), uint8_t(px[i].b * 255));
