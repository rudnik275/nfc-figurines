# Подставка для статуэток: метка NTAG215 в основании → событие в Home Assistant,
# кольцо WS2812B на 24 пикселя играет анимацию (ring_engine.h): заполняется с двух
# сторон, пока метку подносят, «вдыхает», горит и гаснет. Цвет, время свечения и
# сценарий каждой статуэтки задаются в HA блупринтом blueprints/figurine.yaml.
#
# Ключ шифрования — !secret api_key из secrets.yaml (приватный репозиторий
# rudnik275/nfc-figurines-private, сюда кладётся симлинком).
#
# Питание: подставка читает с гнезда USB-C, сколько готов отдать зарядник (линии CC
# на GPIO34/35), и держит ток кольца в этом бюджете — ограничитель в ring_engine.h.
# От USB компьютера через разъём ESP32 гнездо пустое — кольцо автоматически тусклое.
#
# Сброс к заводским (Wi-Fi забыт, снова «Figurki Setup»): 5 раз подряд включить
# питание, каждый раз не дольше 10 с, или кнопка «Сброс к заводским» в HA.
# Сменил Wi-Fi — сбрасывать не обязательно: не найдя старую сеть, подставка через
# минуту сама поднимает «Figurki Setup».

esphome:
  name: figurki
  friendly_name: Статуэтки
  project:
    name: rudnik275.nfc-figurines
    version: "0.3"
  includes:
    - figurki.h
    - ring_engine.h
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: ring
          brightness: 100%
          effect: "Кольцо"

esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_key
  # Без этого устройство перезагружается каждые 15 минут, пока его не добавили в HA.
  reboot_timeout: 0s
  actions:
    # Вызывает блупринт: esphome.figurki_show_color.
    - action: show_color
      variables:
        red: int
        green: int
        blue: int
        hold: float
      then:
        - lambda: 'ring_engine().set_color(red, green, blue, hold);'

ota:
  - platform: esphome

factory_reset:
  resets_required: 5
  max_delay: 10s
  on_increment:
    - logger.log:
        format: "Сброс: включение %u из %u"
        args: ['x', 'target']

# Wi-Fi вводится с телефона: точка доступа «Figurki Setup» → страница выбора сети.
wifi:
  ap:
    ssid: "Figurki Setup"

captive_portal:

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

globals:
  # Сколько мА можно отдать кольцу; пока зарядник не определён — минимум.
  - id: ring_budget
    type: float
    initial_value: '150'
  # Что видит ридер прямо сейчас, без сглаживания: для анимации кольца.
  - id: raw_present
    type: bool
    initial_value: 'false'
  # Ридер изредка пропускает один опрос и при этом объявляет метку снятой.
  # Для Home Assistant статуэтка снята, только если её не видно 1.5 с подряд.
  - id: present_tag
    type: std::string
    initial_value: '""'
  # Номер статуэтки для HA (figurka-N или UID). Поля событий читают его отсюда: лямбды
  # в полях data ESPHome кладёт в main.cpp раньше includes, figurine_id() там не виден.
  - id: present_figurine
    type: std::string
    initial_value: '""'

sensor:
  # Напряжение на линиях CC гнезда USB-C (резисторы 5.1 кОм на земле).
  - platform: adc
    id: cc1
    pin: GPIO34
    attenuation: 12db
    update_interval: 250ms
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1
  - platform: adc
    id: cc2
    pin: GPIO35
    attenuation: 12db
    update_interval: 250ms
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 1

text_sensor:
  - platform: template
    id: power_source
    name: "Блок питания"
    entity_category: diagnostic

button:
  - platform: factory_reset
    name: "Сброс к заводским"
    entity_category: config

interval:
  # Зарядник определяется по трём одинаковым замерам подряд — помехи не дёргают бюджет.
  - interval: 1s
    then:
      - lambda: |-
          static int last = -1, candidate = -1, same = 0;
          int ma = usb_c_source_ma(id(cc1).state, id(cc2).state);
          same = (ma == candidate) ? same + 1 : 0;
          candidate = ma;
          if (same >= 2 && ma != last) {
            last = ma;
            id(ring_budget) = ring_budget_ma(ma);
            const char *txt = ma == 3000 ? "USB-C 3 А"
                            : ma == 1500 ? "USB-C 1.5 А — белый приглушён"
                            : ma == 500  ? "USB 0.5 А — кольцо приглушено"
                                         : "не определён — кольцо приглушено";
            id(power_source).publish_state(txt);
            ESP_LOGI("power", "Блок питания: %s, бюджет кольца %.0f мА (CC1 %.2f В, CC2 %.2f В)",
                     txt, id(ring_budget), id(cc1).state, id(cc2).state);
          }

script:
  - id: confirm_removed
    mode: restart
    then:
      - delay: 1500ms
      - logger.log:
          format: "СНЯЛИ: %s"
          args: ['id(present_tag).c_str()']
      - homeassistant.event:
          event: esphome.figurine_removed
          data:
            tag_id: !lambda 'return id(present_figurine);'
      - lambda: |-
          id(present_tag) = "";
          id(present_figurine) = "";

pn532_spi:
  cs_pin: GPIO5
  # Чаще опрос — точнее «сигнал» для анимации.
  update_interval: 200ms
  on_tag:
    then:
      - lambda: 'id(raw_present) = true;'
      - if:
          condition:
            lambda: 'return x == id(present_tag);'
          then:
            # Та же метка вернулась после пропуска — она никуда не уходила.
            - script.stop: confirm_removed
          else:
            # Статуэтку сменили быстрее 1.5 с — сначала снимаем прежнюю.
            - if:
                condition:
                  script.is_running: confirm_removed
                then:
                  - script.stop: confirm_removed
                  - homeassistant.event:
                      event: esphome.figurine_removed
                      data:
                        tag_id: !lambda 'return id(present_figurine);'
            - lambda: |-
                id(present_tag) = x;
                id(present_figurine) = figurine_id(x);
                ring_engine().new_tag();
            - logger.log:
                format: "ПОСТАВИЛИ: %s"
                args: ['x.c_str()']
            - homeassistant.tag_scanned: !lambda 'return id(present_figurine);'
  on_tag_removed:
    then:
      - lambda: 'id(raw_present) = false;'
      - script.execute: confirm_removed

light:
  - platform: esp32_rmt_led_strip
    id: ring
    # Кольцом управляет только анимация на устройстве, в HA его не видно.
    internal: true
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    pin: GPIO16
    num_leds: 24
    chipset: WS2812
    channel_colors: GRB
    effects:
      - addressable_lambda:
          name: "Кольцо"
          update_interval: 16ms
          lambda: |-
            auto status = RingEngine::Status::kOk;
            if (!wifi::global_wifi_component->is_connected()) {
              status = RingEngine::Status::kWifiSetup;
            } else if (!api::global_api_server->is_connected() && millis() < 15 * 60 * 1000) {
              // Первые 15 минут после включения подсказываем, что HA ещё не подключён.
              status = RingEngine::Status::kNoHa;
            }
            auto &e = ring_engine();
            e.tick(millis(), id(raw_present), status);
            const int n = std::min<int>(it.size(), RingEngine::kPixels);
            RingRgb px[RingEngine::kPixels];
            for (int i = 0; i < n; i++) px[i] = e.pixel(i);
            // Ток кольца — не больше, чем позволяет зарядник.
            limit_power(px, n, id(ring_budget));
            for (int i = 0; i < n; i++)
              it[i] = Color(uint8_t(px[i].r * 255), uint8_t(px[i].g * 255), uint8_t(px[i].b * 255));
