blueprint:
  name: Статуэтка → цвет и сценарий
  description: >-
    Поставили статуэтку на подставку — кольцо загорается её цветом и выполняются
    действия. Сняли — выполняются действия «когда сняли».
    Одна автоматизация на одну статуэтку.
  domain: automation
  source_url: https://github.com/rudnik275/nfc-figurines/blob/main/blueprints/figurine.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    figurine:
      name: Статуэтка
      description: >-
        Номер подписан на основании. Новую метку можно вписать по UID из
        «Настройки → Метки» — она появится там, как только её поставят на подставку.
      selector:
        select:
          custom_value: true
          options:
            - { label: Статуэтка 1, value: figurka-1 }
            - { label: Статуэтка 2, value: figurka-2 }
            - { label: Статуэтка 3, value: figurka-3 }
            - { label: Статуэтка 4, value: figurka-4 }
            - { label: Статуэтка 5, value: figurka-5 }
            - { label: Статуэтка 6, value: figurka-6 }
            - { label: Статуэтка 7, value: figurka-7 }
            - { label: Статуэтка 8, value: figurka-8 }
            - { label: Статуэтка 9, value: figurka-9 }
            - { label: Статуэтка 10, value: figurka-10 }
    color:
      name: Цвет кольца
      default: [255, 140, 0]
      selector:
        color_rgb: {}
    hold:
      name: Сколько секунд гореть
      description: Столько кольцо горит после того, как статуэтку поставили, потом плавно гаснет.
      default: 3
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: с
          mode: slider
    placed_actions:
      name: Что сделать, когда поставили
      default: []
      selector:
        action: {}
    removed_actions:
      name: Что сделать, когда сняли
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

variables:
  color: !input color
  hold: !input hold

triggers:
  - trigger: tag
    tag_id: !input figurine
    id: placed
  - trigger: event
    event_type: esphome.figurine_removed
    event_data:
      tag_id: !input figurine
    id: removed

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: placed
        sequence:
          # Анимацию играет подставка, отсюда — только цвет и время свечения.
          - action: esphome.figurki_show_color
            continue_on_error: true
            data:
              red: "{{ color[0] | int }}"
              green: "{{ color[1] | int }}"
              blue: "{{ color[2] | int }}"
              hold: "{{ hold | float }}"
          - choose: []
            default: !input placed_actions
      - conditions:
          - condition: trigger
            id: removed
        sequence:
          - choose: []
            default: !input removed_actions
