blueprint:
  name: Статуэтка → цвет и сценарий
  description: >-
    Поставили статуэтку на подставку — кольцо загорается её цветом и выполняются
    действия. Сняли — выполняются действия «когда сняли».
    Одна автоматизация на одну статуэтку. Новые метки появляются сами: поставь метку
    на подставку, и она появится в «Настройки → Метки» и в списке ниже.
  domain: automation
  source_url: https://github.com/rudnik275/nfc-figurines/blob/main/blueprints/figurine.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    figurine:
      name: Метка статуэтки
      description: >-
        Новая метка появится в этом списке, как только её впервые поставят на подставку.
        Дать ей понятное имя можно в «Настройки → Метки».
      selector:
        entity:
          filter:
            - domain: tag
    color:
      name: Цвет кольца
      default: [255, 140, 0]
      selector:
        color_rgb: {}
    hold:
      name: Сколько секунд гореть
      description: Столько кольцо горит после того, как статуэтку поставили, потом плавно гаснет.
      default: 3
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: с
          mode: slider
    placed_actions:
      name: Что сделать, когда поставили
      default: []
      selector:
        action: {}
    removed_actions:
      name: Что сделать, когда сняли
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

variables:
  figurine: !input figurine
  tag_id: "{{ state_attr(figurine, 'tag_id') }}"
  color: !input color
  hold: !input hold

triggers:
  # Сущность метки меняет состояние (время сканирования) при каждой постановке.
  - trigger: state
    entity_id: !input figurine
    not_from:
      - unknown
      - unavailable
    id: placed
  - trigger: event
    event_type: esphome.figurine_removed
    id: removed

# «Сняли» приходит для любой метки — чужие отсекаются до запуска, чтобы mode: restart
# не обрывал действия этой статуэтки.
conditions:
  - condition: template
    value_template: "{{ trigger.id == 'placed' or trigger.event.data.tag_id == tag_id }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: placed
        sequence:
          # Анимацию играет подставка, отсюда — только цвет и время свечения.
          - action: esphome.figurki_show_color
            continue_on_error: true
            data:
              red: "{{ color[0] | int }}"
              green: "{{ color[1] | int }}"
              blue: "{{ color[2] | int }}"
              hold: "{{ hold | float }}"
          - choose: []
            default: !input placed_actions
      - conditions:
          - condition: trigger
            id: removed
        sequence:
          - choose: []
            default: !input removed_actions
